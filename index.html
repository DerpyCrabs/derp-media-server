<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Derp Desk</title>
    <meta
      name="description"
      content="Your private desk for media, documents, workspaces, and canvases"
    />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/derp-desk-icon.svg" />
    <script>
      ;(function () {
        var p = localStorage.getItem('theme-palette') || 'default'
        var m = localStorage.getItem('theme-mode') || 'dark'
        var dark =
          m === 'dark' ||
          (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', p + '-' + (dark ? 'dark' : 'light'))
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <!--DEHYDRATED-->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
