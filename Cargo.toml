[package]
name = "derp-media-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "derp-media-server"
path = "server/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
async-stream = "0.3"
base64 = "0.23"
bytes = "1"
chrono = "0.4"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "webp",
] }
lofty = "0.24"
moxcms = "0.9"
http-body-util = "0.1"
json5 = "1.3"
mime_guess = "2"
natord = "1"
notify = "8"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "query"] }
resvg = "0.48"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
filetime = "0.2"
fast_image_resize = { version = "6", features = ["image"] }
webp = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.30"
tower = "0.5"
tower-http = { version = "0.7", features = [
  "compression-br",
  "compression-gzip",
  "fs",
  "trace",
  "cors",
] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true
