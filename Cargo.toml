[package]
name = "derp-media-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "derp-media-server"
path = "server/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
async-stream = "0.3.6"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "webp",
] }
lofty = "0.25.5"
moxcms = "0.9.1"
http-body-util = "0.1.5"
json5 = "1.3.6"
mime_guess = "2.0.5"
natord = "1.0.9"
notify = "8.2.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "stream",
  "json",
  "query",
  "rustls",
] }
resvg = "0.49.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
filetime = "0.2.29"
fast_image_resize = { version = "6.1.0", features = ["image"] }
webp = "0.3.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
  "compression-br",
  "compression-gzip",
  "fs",
  "trace",
  "cors",
] }
url = "2.5.8"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
xz2 = "0.1.7"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }
trash = "5.2.9"
